<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fbfaf7; --panel:#f2f0ea; --ink:#1f2328; --muted:#5d636b; --line:#dedad0;
  --accent:#b4471f; --accent-soft:#f6e3d8; --code-bg:#f4f2ec; --note:#eef4fb; --note-line:#3d6fa8;
  --warn:#fdf3e1; --warn-line:#c08a1e; --why:#f1f7ee; --why-line:#4f8a3c; --use:#f3effb; --use-line:#7a5bc0;
  --sidebar-w:310px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#16181c; --panel:#1d2025; --ink:#e6e3dc; --muted:#a09d96; --line:#30343a;
    --accent:#f08a5d; --accent-soft:#3a2a22; --code-bg:#1f2227; --note:#1b2633; --note-line:#6fa0d8;
    --warn:#2d2616; --warn-line:#d8a548; --why:#1c2a1c; --why-line:#7cbf68; --use:#241f33; --use-line:#a98ee8;
  }
}
:root[data-theme="dark"]{
  --bg:#16181c; --panel:#1d2025; --ink:#e6e3dc; --muted:#a09d96; --line:#30343a;
  --accent:#f08a5d; --accent-soft:#3a2a22; --code-bg:#1f2227; --note:#1b2633; --note-line:#6fa0d8;
  --warn:#2d2616; --warn-line:#d8a548; --why:#1c2a1c; --why-line:#7cbf68; --use:#241f33; --use-line:#a98ee8;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.8 "Noto Sans KR",system-ui,sans-serif;display:flex}
a{color:var(--accent)}
#sidebar{width:var(--sidebar-w);flex:none;height:100vh;position:sticky;top:0;overflow-y:auto;background:var(--panel);border-right:1px solid var(--line);padding:20px 14px 40px}
#sidebar .brand{font-weight:700;font-size:18px;margin:0 6px 4px}
#sidebar .sub{color:var(--muted);font-size:12.5px;margin:0 6px 14px}
#search{width:100%;padding:7px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font:inherit;font-size:13.5px;margin-bottom:10px}
#toc{list-style:none;margin:0;padding:0}
#toc li.ch>a{display:block;padding:6px 8px;border-radius:6px;font-weight:600;font-size:14px;color:var(--ink);text-decoration:none;line-height:1.45}
#toc li.ch>a .num{color:var(--accent);margin-right:6px}
#toc ul{list-style:none;margin:2px 0 6px;padding:0 0 0 14px;display:none}
#toc li.ch.open ul{display:block}
#toc ul a{display:block;padding:3px 8px;font-size:13px;color:var(--muted);text-decoration:none;border-left:2px solid var(--line);line-height:1.5}
#toc a:hover{background:var(--accent-soft)}
#toc li.ch.active>a{background:var(--accent-soft)}
#toc ul a.active{color:var(--accent);border-left-color:var(--accent)}
#toc li.hide{display:none}
#main{flex:1;min-width:0;height:100vh;overflow-y:auto}
#content{max-width:880px;margin:0;padding:36px 40px 80px 36px}
.chapter{display:none}
.chapter.show{display:block}
.chapter h1{font-size:30px;line-height:1.35;margin:0 0 6px}
.chapter .lead{color:var(--muted);font-size:16.5px;border-bottom:1px solid var(--line);padding-bottom:18px;margin-bottom:28px}
.chapter h2{font-size:22px;margin:44px 0 12px;padding-top:6px;scroll-margin-top:16px}
.chapter h3{font-size:18px;margin:28px 0 8px}
p{margin:0 0 14px}
code{font-family:"JetBrains Mono",Consolas,monospace;font-size:.86em;background:var(--code-bg);padding:1px 5px;border-radius:4px}
pre{background:var(--code-bg);border:1px solid var(--line);border-radius:8px;padding:14px 16px;overflow-x:auto;font-size:13.5px;line-height:1.6}
pre code{background:none;padding:0;font-size:inherit}
pre .src{display:block;color:var(--muted);font-size:12px;margin-bottom:6px}
table{border-collapse:collapse;width:100%;margin:10px 0 18px;font-size:14px;display:block;overflow-x:auto}
th,td{border:1px solid var(--line);padding:6px 10px;text-align:left;vertical-align:top}
th{background:var(--panel);white-space:nowrap}
td code{white-space:nowrap}
.box{border-left:4px solid;border-radius:6px;padding:12px 16px;margin:16px 0}
.box>b:first-child{display:block;margin-bottom:4px}
.why{background:var(--why);border-color:var(--why-line)}
.note{background:var(--note);border-color:var(--note-line)}
.warn{background:var(--warn);border-color:var(--warn-line)}
/* 🛠 사용법 상자: 원리에서 나오는 실제 사용법. 부록 A 가 id(use-*)로 링크한다 */
.use{background:var(--use);border-color:var(--use-line)}
.use>b:first-child{color:var(--use-line)}
.use>b:first-child::before{content:"🛠 "}
.use pre{background:var(--bg)}
#toc ul a .use-mark{margin-left:4px;font-size:11px}
.mermaid{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:14px;margin:14px 0 6px;text-align:center;overflow-x:auto}
.cap{color:var(--muted);font-size:13px;text-align:center;margin:0 0 18px}
.pager{display:flex;justify-content:space-between;gap:12px;margin-top:56px;border-top:1px solid var(--line);padding-top:18px}
.pager a{text-decoration:none;font-weight:600}
#menu-btn,#theme-btn{position:fixed;z-index:20;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:6px;padding:4px 10px;font:inherit;font-size:13px;cursor:pointer}
#theme-btn{top:12px;right:14px}
#menu-btn{top:12px;left:12px;display:none}
@media (max-width:900px){
  body{display:block}
  #sidebar{position:fixed;left:0;top:0;z-index:15;transform:translateX(-100%);transition:transform .2s;box-shadow:0 0 30px rgba(0,0,0,.2)}
  body.nav-open #sidebar{transform:none}
  #menu-btn{display:block}
  #main{height:auto}
  #content{padding:56px 16px 60px}
  .chapter h1{font-size:25px}
}
</style>
</head>
<body>
<button id="menu-btn" aria-label="목차 열기">☰ 목차</button>
<button id="theme-btn" aria-label="테마 전환">◐</button>
<nav id="sidebar">
  <div class="brand">{{title}}</div>
  <div class="sub">{{subtitle}}</div>
  <input id="search" type="search" placeholder="목차 검색">
  <ul id="toc"></ul>
</nav>
<div id="main"><main id="content">
<!--CHAPTERS-->
</main></div>
<script src="https://cdn.jsdelivr.net/npm/mermaid@11.4.1/dist/mermaid.min.js"></script>
<script>
(function(){
  const root=document.documentElement;
  try{const t=localStorage.getItem('{{book_id}}-theme'); if(t) root.dataset.theme=t;}catch(e){}
  const isDark=()=>root.dataset.theme==='dark'||(!root.dataset.theme&&matchMedia('(prefers-color-scheme: dark)').matches);
  const chapters=[...document.querySelectorAll('.chapter')];
  chapters.forEach(c=>c.querySelectorAll('.mermaid').forEach(m=>{m.dataset.src=[...m.childNodes].map(n=>n.nodeType===3?n.data:n.outerHTML).join('');/* textContent 는 라벨의 <br/>·<b> 를 지운다 */}));
  const toc=document.getElementById('toc');
  chapters.forEach((c,i)=>{
    const li=document.createElement('li');li.className='ch';li.dataset.ch=c.id;
    const h1=c.querySelector('h1');
    li.innerHTML='<a href="#'+c.id+'">'+h1.innerHTML+'</a>';
    const ul=document.createElement('ul');
    c.querySelectorAll('h2[id]').forEach(h=>{const a=document.createElement('a');a.href='#'+h.id;a.textContent=h.textContent;
      /* 절 안에 🛠 사용법 상자가 있으면 목차에 표지를 단다 */
      for(let n=h.nextElementSibling;n&&n.tagName!=='H2';n=n.nextElementSibling){if(n.matches('.use')||n.querySelector('.use')){a.insertAdjacentHTML('beforeend','<span class="use-mark" title="사용법이 있는 절">🛠</span>');break;}}
      const l=document.createElement('li');l.appendChild(a);ul.appendChild(l);});
    li.appendChild(ul);toc.appendChild(li);
    const pg=document.createElement('div');pg.className='pager';
    const prev=chapters[i-1],next=chapters[i+1];
    pg.innerHTML=(prev?'<a href="#'+prev.id+'">← '+prev.querySelector('h1').textContent+'</a>':'<span></span>')+(next?'<a href="#'+next.id+'">'+next.querySelector('h1').textContent+' →</a>':'<span></span>');
    c.appendChild(pg);
  });
  let mmReady=false;
  function initMermaid(){ if(!window.mermaid) return false; mermaid.initialize({startOnLoad:false,theme:isDark()?'dark':'neutral',securityLevel:'loose',flowchart:{curve:'basis',htmlLabels:true},fontFamily:'Noto Sans KR, sans-serif'}); mmReady=true; return true;}
  async function renderMermaid(c,force){
    if(!mmReady&&!initMermaid()) return;
    const nodes=[...c.querySelectorAll('.mermaid')].filter(n=>force||!n.dataset.done);
    nodes.forEach(n=>{n.removeAttribute('data-processed');n.innerHTML='';n.textContent=n.dataset.src;n.dataset.done='1';});
    if(nodes.length){try{await mermaid.run({nodes});}catch(e){console.warn(e);}}
    nodes.forEach(fixMarkers);
  }
  /* 시퀀스 다이어그램은 화살촉 marker id(arrowhead 등)를 SVG마다 똑같이 쓴다. 숨은 장의 SVG가 먼저 그 id를 차지하면
     url(#arrowhead) 가 보이지 않는 marker 를 가리켜 촉이 사라지므로, SVG마다 id를 고유하게 바꾼다. */
  function fixMarkers(n){
    const svg=n.querySelector('svg'); if(!svg||!svg.id) return;
    const map={};
    svg.querySelectorAll('marker[id]').forEach(m=>{ if(!m.id.startsWith(svg.id)){ const nid=svg.id+'-'+m.id; map[m.id]=nid; m.id=nid; } });
    if(!Object.keys(map).length) return;
    const re=/url\(\s*["']?#([^"')]+)["']?\s*\)/g, sub=v=>v.replace(re,(s,id)=>map[id]?'url(#'+map[id]+')':s);
    svg.querySelectorAll('[marker-end],[marker-start],[marker-mid],[style*="url("]').forEach(el=>{
      ['marker-end','marker-start','marker-mid','style'].forEach(a=>{const v=el.getAttribute(a); if(v&&v.includes('url(')) el.setAttribute(a,sub(v));});
    });
    svg.querySelectorAll('style').forEach(s=>{ if(s.textContent.includes('url(')) s.textContent=sub(s.textContent); });
  }
  const main=document.getElementById('main');
  function show(hash){
    let id=(hash||'').replace('#','');
    let target=id?document.getElementById(id):null;
    let ch=target?(target.classList.contains('chapter')?target:target.closest('.chapter')):chapters[0];
    if(!ch) ch=chapters[0];
    chapters.forEach(c=>c.classList.toggle('show',c===ch));
    document.querySelectorAll('#toc li.ch').forEach(li=>{const on=li.dataset.ch===ch.id;li.classList.toggle('active',on);li.classList.toggle('open',on);});
    document.querySelectorAll('#toc ul a').forEach(a=>a.classList.toggle('active',a.getAttribute('href')==='#'+id));
    renderMermaid(ch).then(()=>{
      if(target&&target!==ch){target.scrollIntoView({block:'start'});} else {main.scrollTop=0;window.scrollTo(0,0);}
    });
    document.body.classList.remove('nav-open');
  }
  window.addEventListener('hashchange',()=>show(location.hash));
  document.getElementById('menu-btn').onclick=()=>document.body.classList.toggle('nav-open');
  document.getElementById('theme-btn').onclick=()=>{
    root.dataset.theme=isDark()?'light':'dark';
    try{localStorage.setItem('{{book_id}}-theme',root.dataset.theme);}catch(e){}
    mmReady=false; chapters.forEach(c=>c.querySelectorAll('.mermaid').forEach(n=>delete n.dataset.done));
    renderMermaid(chapters.find(c=>c.classList.contains('show')),true);
  };
  document.getElementById('search').addEventListener('input',e=>{
    const q=e.target.value.trim().toLowerCase();
    document.querySelectorAll('#toc li.ch').forEach(li=>{
      const subs=[...li.querySelectorAll('ul li')];let any=false;
      subs.forEach(s=>{const m=!q||s.textContent.toLowerCase().includes(q);s.classList.toggle('hide',!m);any=any||m;});
      const self=li.firstChild.textContent.toLowerCase().includes(q);
      li.classList.toggle('hide',!!q&&!self&&!any);
      if(q) li.classList.toggle('open',any||self);
    });
  });
  window.addEventListener('load',()=>show(location.hash));
  if(document.readyState==='complete') show(location.hash);
})();
</script>
</body>
</html>
