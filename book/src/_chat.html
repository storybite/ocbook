      return pump();
    }).catch(function(err){
      if (stopping) settleStop();
      if (finished) return;
      onEvent({type: 'error', message: (err.message || err) + (err instanceof TypeError ? ' — 챗봇 서버가 실행 중인지 확인하세요.' : '')});
    });
    }
  }

  function open(anchor){
    if (anchor) state.anchor = anchor;
    renderAnchor();
    if (!elLog.children.length) elLog.innerHTML = EMPTY;
    box.classList.add('open');
    restorePos();
    loadHist();
    input.focus();
  }
  // 대화 끝: 이력 버튼은 서버에 남고, 다음 질문은 새 버튼으로 시작한다
  function endConversation(){
    state.summary = ''; state.history = []; state.convId = null; state.firstQ = ''; state.firstSection = '';
    state.pendingStop = null;     // 멈춘 앞 대화의 마무리는 새 대화와 무관하다(도착해도 convId 가 달라 반영하지 않음)
    elLog.innerHTML = EMPTY; renderHist();
  }
  function close(){ endConversation(); box.classList.remove('open'); setActive(null); }

  box.querySelector('.x').onclick = close;
  // [새 대화]·Ctrl+N: 답을 만드는 중이면 먼저 멈춘다(멈춘 턴은 서버가 앞 대화에 저장). 입력 중인 글은 그대로 둔다
  function newConversation(){
    if (state.running) state.running.stop();
    endConversation(); input.focus();
  }
  box.querySelector('.reset').onclick = newConversation;

  // ---------- 대화 이력 (서버 conversations/*.json) ----------
  var hist = [];
  function newId(){
    if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
    return (Date.now().toString(16) + Math.random().toString(16).slice(2) + '00000000').slice(0, 32);
  }
  function when(t){
    var d = new Date(t), p = function(n){ return (n < 10 ? '0' : '') + n; };
    return p(d.getMonth() + 1) + '/' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
  }
  function loadHist(){
    if (location.protocol === 'file:') return renderHist();
    fetch('/api/conversations?book=' + BOOK_ID).then(function(r){ return r.ok ? r.json() : []; })
      .then(function(j){ hist = j; renderHist(); markBlocks(); }, function(){ renderHist(); });
  }
  // 목록에는 지금 선택한 블록(앵커)에서 나눈 대화만 보인다. 진행 중인 대화는 블록과 상관없이 보인다
  function renderHist(){
    var live = state.convId, a = state.anchor, key = a && a.target ? spotKey(a.section_id, a.target) : null;
    var items = hist.filter(function(c){
      return c.id === live || !key || (c.spots || []).some(function(s){ return spotKey(s.section_id, s.target) === key; });
    });
    if (live && !items.some(function(c){ return c.id === live; }))      // 첫 답변이 저장되기 전에도 버튼을 보인다
      items.unshift({ id: live, title: state.firstQ, section_title: state.firstSection, updated: Date.now(), turns: 0 });
    if (!items.length) { elHist.innerHTML = '<div class="ch-hist-empty">이 블록에서 나눈 대화가 없습니다. 질문하면 여기에 버튼이 생기고, 창을 닫기 전까지는 같은 버튼에 이어집니다.</div>'; return; }
    elHist.innerHTML = items.map(function(c){
      var isLive = c.id === live;
      return '<button type="button" class="ch-hist-item' + (isLive ? ' cur' : '') + '" data-id="' + esc(c.id) + '" title="' + esc(c.title) + '">' +
        '<div class="q">' + (isLive ? '<span class="live">진행 중</span>' : '') + esc(c.title) + '</div>' +
        '<div class="m">' + esc(c.section_title || '위치 없음') + ' · ' + when(c.updated) + (c.turns ? ' · ' + c.turns + '문답' : '') + '</div></button>';
    }).join('');
  }
  elHist.addEventListener('click', function(e){
    var b = e.target.closest('.ch-hist-item'); if (!b || b.dataset.id === state.convId) return;
    if (state.busy) { b.title = '답변을 받는 중에는 다른 대화로 바꿀 수 없습니다'; return; }
    resume(b.dataset.id);
  });
  // 카드 우클릭 → 삭제 메뉴. 서버의 이력 파일만 지운다(비용 기록은 남김)
  var histMenu = document.createElement('div');
  histMenu.id = 'histMenu'; histMenu.setAttribute('role', 'menu');
  histMenu.innerHTML = '<button type="button" role="menuitem" class="del">🗑 대화 삭제</button>';
  document.body.appendChild(histMenu);
  var menuId = null, delBtn = histMenu.querySelector('.del');
  function hideHistMenu(){ histMenu.style.display = 'none'; menuId = null; }
  elHist.addEventListener('contextmenu', function(e){
    var b = e.target.closest('.ch-hist-item'); if (!b) return;
    e.preventDefault();
    menuId = b.dataset.id;
    var busyHere = state.busy && menuId === state.convId;
    delBtn.disabled = busyHere; delBtn.textContent = busyHere ? '답변을 받는 중에는 삭제할 수 없습니다' : '🗑 대화 삭제';
    histMenu.style.display = 'block';
    var mw = histMenu.offsetWidth, mh = histMenu.offsetHeight;
    histMenu.style.left = Math.min(e.clientX, innerWidth - mw - 8) + 'px';
    histMenu.style.top = Math.min(e.clientY, innerHeight - mh - 8) + 'px';
  });
  addEventListener('pointerdown', function(e){ if (!histMenu.contains(e.target)) hideHistMenu(); }, true);
  addEventListener('scroll', hideHistMenu, true);
  delBtn.onclick = function(){
    var id = menuId, c = hist.filter(function(x){ return x.id === id; })[0];
    hideHistMenu();
    if (!id) return;
    var title = c ? c.title : state.firstQ;
    BookDialog.confirm({ title: '대화 삭제', message: '"' + (title || '').slice(0, 40) + '"\n\n이 대화를 삭제할까요? 되돌릴 수 없습니다.',
                         ok: '삭제', danger: true }).then(function(yes){ if (yes) remove(id); });
  };
  function remove(id){
    var fail = function(msg){ BookDialog.alert({ title: '삭제하지 못했습니다', message: msg }); };
    var drop = function(){
      if (state.convId === id) endConversation();       // 진행 중인 대화였으면 새 대화 상태로
      hist = hist.filter(function(x){ return x.id !== id; });
      renderHist(); markBlocks();
    };
    fetch('/api/conversations/' + encodeURIComponent(id) + '?book=' + BOOK_ID, { method: 'DELETE' }).then(function(r){
      if (r.ok || r.status === 404) drop();                // 404: 첫 답변 전이라 아직 저장되지 않은 대화
      else r.json().then(function(j){ fail(j.detail || ('HTTP ' + r.status)); }, function(){ fail('HTTP ' + r.status); });
    }, function(){ fail('챗봇 서버가 실행 중인지 확인하세요.'); });
  }

  // 지난 대화를 불러와 이어 간다. 이후 질문은 같은 이력에 쌓이고, 모델에는 저장된 문답을 대화 기록으로 넘긴다
  function resume(id){
    endConversation();
    state.convId = id; renderHist();
    state.busy = true; sendBtn.disabled = true;          // 불러오는 동안 전송 금지
    var loaded = function(){ state.busy = false; sendBtn.disabled = false; };
    elLog.innerHTML = '<div class="ch-empty">불러오는 중…</div>';
    fetch('/api/conversations/' + encodeURIComponent(id) + '?book=' + BOOK_ID).then(function(r){
      if (!r.ok) throw new Error('HTTP ' + r.status); return r.json();
    }).then(function(c){
      loaded();
      if (state.convId !== id) return;
      state.firstQ = c.turns[0].question; state.firstSection = c.turns[0].section_title;
      state.history = [];
      elLog.innerHTML = '<div class="ch-note">' + when(c.created) + '에 시작한 대화를 이어 갑니다. 새로 질문하면 이 대화에 이어서 저장됩니다.</div>';
      c.turns.forEach(function(t){
        var whole = t.scope === 'section';
        state.history.push({ role: 'user', content: (t.section_title ? '(' + t.section_title + (whole ? ' 절 전체에 대해 질문) ' : '에서 질문) ') : '') + t.question },
                           { role: 'assistant', content: t.stopped ? (t.answer || '(답변 전)') + '\n(사용자가 답변 도중 중지함)' : t.answer });
        var u = document.createElement('div'); u.className = 'ch-msg user';
        u.innerHTML = (t.section_title ? '<div class="where">📍 ' + esc(t.section_title) + (whole ? ' · 절 전체' : '') + '</div>' : '') + imgsHtml(t.images || []) +
          (t.edit_mode ?'<span class="ch-tag" title="책 수정 모드에서 보낸 요청">✏️ 수정</span>' : '') + esc(t.question);
        var b = document.createElement('div'); b.className = 'ch-msg bot';
        var a = document.createElement('div'); a.className = 'ch-answer'; a.innerHTML = md(t.answer);
        if (t.answer) addCopy(b, t.answer);
        b.appendChild(a);
        if (t.stopped) b.insertAdjacentHTML('beforeend', '<div class="ch-stopped">⏹ 중지함</div>');
        var web = t.web || [];
        b.insertAdjacentHTML('beforeend', '<details><summary>탐색 기록 — ' + srcLabel(t.reads.length, web.length) +
          (t.cost != null ? ' · ' + BookUsage.usd(t.cost) : '') + '</summary><ol class="ch-trace">' +
          t.reads.map(function(p){ return '<li>' + (/^v[12] 소스/.test(p) ? '🧩' : '📖') + ' <code>' + esc(p) + '</code></li>'; }).join('') +
          web.map(function(w){ return '<li class="web">' + webLine(w) + '</li>'; }).join('') +
          (t.edits || []).map(function(e){ return '<li>✏️ <code>' + esc(e.file) + '</code> <a href="#' + esc(e.section) + '">#' + esc(e.section) + '</a> 수정</li>'; }).join('') +
          '<li>🤖 ' + esc(t.model || '') + ' · 모델 호출 ' + t.calls + '회 · ' + when(t.t) + '</li></ol></details>');
        elLog.appendChild(u); elLog.appendChild(b);
        enhance(a, true);
      });
      elLog.scrollTop = elLog.scrollHeight;
      input.focus();
    }).catch(function(err){
      loaded();
      if (state.convId === id) elLog.innerHTML = '<div class="ch-msg err">이력을 불러오지 못했습니다: ' + esc(err.message || err) + '</div>';
    });
  }
  // ---------- 대화한 블록에 💬 표시 ----------
  // 이력의 각 질문에 저장된 (절 id, 블록 본문 앞부분)을 지금 보이는 장의 블록과 맞춰 본다
  var marks = [];
  function norm(t){ return String(t || '').replace(/\s+/g, ' ').trim().slice(0, 60); }   // 앞 60자: 책을 조금 고쳐도 표시가 유지되게
  function spotKey(sectionId, target){ return sectionId + '|' + norm(target); }
  function markBlocks(){
    marks.forEach(function(m){ m.btn.remove(); }); marks = [];
    var ch = content.querySelector('section.chapter.show'); if (!ch) return;
    var bySpot = {};
    hist.forEach(function(c){
      (c.spots || []).forEach(function(s){
        var k = spotKey(s.section_id, s.target);
        (bySpot[k] = bySpot[k] || []).push(c);          // hist 는 최근 대화가 앞
      });
    });
    if (!Object.keys(bySpot).length) return;
    ch.querySelectorAll('*').forEach(function(el){
      var key, head = isHead(el);
      if (head) key = spotKey(el.id, secTarget(el));
      else if (isBlock(el) && !el.classList.contains('cap')) { var sec = secOf(el); key = spotKey(sec ? sec.id : ch.id, blockText(el)); }
      else return;
      var convs = bySpot[key];
      if (!convs) return;
      var btn = document.createElement('button');
      btn.type = 'button'; btn.className = 'chat-mark';
      btn.textContent = '💬' + (convs.length > 1 ? ' ' + convs.length : '');
      btn.title = (head ? '이 절 전체에 대해 나눈 대화 ' : '이 블록에서 나눈 대화 ') + convs.length + '건 (클릭하면 가장 최근 대화를 엽니다)\n' +
        convs.map(function(c){ return '· ' + c.title + ' (' + when(c.updated) + ')'; }).join('\n');
      btn.onclick = function(){
        setActive(el); open(collect(el));
        if (!state.busy && state.convId !== convs[0].id) resume(convs[0].id);
      };
      content.appendChild(btn);
      marks.push({ el: el, btn: btn });
    });
    placeMarks();
  }
  function placeMarks(){
    var c = content.getBoundingClientRect();
    marks.forEach(function(m){
      var r = m.el.getBoundingClientRect();
      if (!r.height) { m.btn.style.display = 'none'; return; }
      m.btn.style.display = 'block';
      m.btn.style.left = (r.right - c.left + 6) + 'px';
      m.btn.style.top = (r.top - c.top) + 'px';
    });
  }
  addEventListener('hashchange', function(){ setTimeout(markBlocks, 0); });   // 다른 장이 보이면 다시 맞춘다
  addEventListener('resize', placeMarks);
  if (window.ResizeObserver) new ResizeObserver(placeMarks).observe(content); // 다이어그램 렌더 등으로 높이가 바뀔 때

  loadHist();
  sendBtn.onclick = send;
  input.addEventListener('keydown', function(e){
    if (e.key !== 'Enter' || e.shiftKey || e.altKey || e.isComposing) return;
    e.preventDefault();
    // Ctrl+Enter(맥은 Cmd+Enter): [✏️ 책 수정]을 켜고 이 요청을 책 수정 요청으로 보낸다.
    // 고치고 나면 평소처럼 저절로 꺼진다. 보낼 글이 없으면 모드만 켠다
    if (e.ctrlKey || e.metaKey) {
      if (state.busy) return;
      setEditMode(true);
      if (input.value.trim() || attach.length) send();
      return;
    }
    send();
  });
  // Ctrl+N(맥은 Cmd+N): 채팅창이 열려 있으면 새 대화. 한글 입력 중이면 e.key 가 'ㅜ'이므로 물리 키(code)로 본다.
  // 일반 브라우저 탭에서는 브라우저가 이 키를 '새 창'으로 먼저 가져가 페이지까지 오지 않는다(앱 창에서는 온다)
  addEventListener('keydown', function(e){
    if (!(e.ctrlKey || e.metaKey) || e.shiftKey || e.altKey) return;
    if (e.code !== 'KeyN' && e.key !== 'n' && e.key !== 'N') return;
    if (!box.classList.contains('open') || document.getElementById('bookDialog').classList.contains('open')) return;
    e.preventDefault();
    hideHistMenu();
    newConversation();
  });
  addEventListener('keydown', function(e){
    if (e.key !== 'Escape' || e.isComposing) return;
    if (histMenu.style.display === 'block') { hideHistMenu(); return; }
    if (state.running && box.classList.contains('open')) { e.preventDefault(); state.running.stop(); return; }   // 답을 만드는 중이면 창을 닫지 않고 멈춘다
    if (box.classList.contains('open')) close();
  });

  // 제목줄 드래그 (참조 책 #ndBox 패턴)
  var head = box.querySelector('.ch-head'), drag = null;
  head.addEventListener('pointerdown', function(e){
    if (e.button !== 0 || e.target.closest('button, select')) return;
    var r = box.getBoundingClientRect();
    box.style.left = r.left + 'px'; box.style.top = r.top + 'px'; box.style.right = 'auto'; box.style.bottom = 'auto';
    drag = { id: e.pointerId, x: e.clientX - r.left, y: e.clientY - r.top };
    box.classList.add('dragging'); e.preventDefault();
  });
  addEventListener('pointermove', function(e){
    if (!drag || e.pointerId !== drag.id) return;
    var r = box.getBoundingClientRect(), edge = 8;
    place(e.clientX - drag.x, e.clientY - drag.y);
  });
  function endDrag(e){ if (drag && e.pointerId === drag.id) { drag = null; box.classList.remove('dragging'); savePos(); } }

  // 옮긴 위치를 기억해 다음에 열 때(새로고침 후에도) 그 자리에 연다. 창이 줄어 화면을 벗어나면 안쪽으로 당긴다
  var POS_KEY = 'bookChat.pos';
  function place(left, top){
    var r = box.getBoundingClientRect(), edge = 8, W = document.documentElement.clientWidth;   // 세로 스크롤바 제외
    box.style.left = Math.max(edge, Math.min(left, W - r.width - edge)) + 'px';
    box.style.top = Math.max(edge, Math.min(top, innerHeight - r.height - edge)) + 'px';
    box.style.right = 'auto'; box.style.bottom = 'auto';
  }
  function savePos(){
    try { localStorage.setItem(POS_KEY, JSON.stringify({ left: parseFloat(box.style.left), top: parseFloat(box.style.top) })); } catch (e) {}
  }
  function restorePos(){
    var p = null;
    try { p = JSON.parse(localStorage.getItem(POS_KEY)); } catch (e) {}
    if (p && isFinite(p.left) && isFinite(p.top)) place(p.left, p.top);
  }
  addEventListener('pointerup', endDrag); addEventListener('pointercancel', endDrag);
})();
</script>
<script>
// 토큰 사용량·비용 — 서버의 누적 기록(/api/usage, 재기동해도 유지)을 모델별로 합산한다.
// 챗봇 창 제목줄에 누적 비용 버튼을 두고, 누르면 창 안에 상세 패널(입력·출력·모델별 차트·표)을 펼친다.
// window.BookUsage.add(record) · reload() · usd(v) · tok(n)
(function(){
  var log = [], loadErr = '';

  var fmtTok = function(n){ return (n || 0).toLocaleString('ko-KR'); };
  var fmtUsd = function(v){
    if (v == null) return '—';
    return '$' + (v >= 1 ? v.toFixed(2) : v >= 0.01 ? v.toFixed(4) : v.toFixed(5));
  };
  var esc = function(s){ return String(s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); };

  // 기록을 모델별로 합산. 단가를 모르는 기록이 하나라도 있으면 그 모델의 비용은 null
  function byModel(){
    var map = {}, order = [];
    log.forEach(function(r){
      var k = r.model || '(모델 미기록)', g = map[k];
      if (!g) { g = map[k] = { model: k, q: 0, calls: 0, pt: 0, ct: 0, ic: 0, oc: 0, ok: true, last: 0 }; order.push(g); }
      g.q++; g.calls += r.calls || 0; g.pt += r.pt || 0; g.ct += r.ct || 0; g.last = Math.max(g.last, r.t || 0);
      if (r.ic == null || r.oc == null) g.ok = false; else { g.ic += r.ic; g.oc += r.oc; }
    });
    order.forEach(function(g){ if (!g.ok) { g.ic = g.oc = null; } g.cost = g.ok ? g.ic + g.oc : null; });
    return order.sort(function(a, b){ return b.last - a.last; });   // 최근에 쓴 모델이 위
  }

  var panel = document.createElement('div');
  panel.id = 'usagePanel';
  panel.setAttribute('role', 'region'); panel.setAttribute('aria-label', '챗봇 토큰 사용량과 비용');
  panel.innerHTML =
    '<div class="up-head"><span class="up-title">토큰 사용량 · 비용</span>' +
    '<button type="button" class="reset" title="서버에 쌓인 누적 기록을 지웁니다">초기화</button>' +
    '<button type="button" class="fold" title="닫기">×</button></div>' +
    '<div class="up-body"></div>';
  var tip = document.createElement('div'); tip.id = 'usageTip'; document.body.appendChild(tip);
  var body = panel.querySelector('.up-body');

  // 챗봇 창 제목줄의 비용 버튼 → 창 안 드롭다운. 책 본문 오른쪽 공간을 차지하지 않는다
  var costBtn = document.createElement('button');
  costBtn.type = 'button'; costBtn.className = 'ch-cost'; costBtn.setAttribute('aria-expanded', 'false');
  costBtn.title = '누적 토큰 사용량·비용 — 클릭하면 자세히 봅니다';
  var chat = document.getElementById('chatBox');
  if (chat) { chat.querySelector('.ch-head .reset').before(costBtn); chat.appendChild(panel); }
  function show(on){
    panel.classList.toggle('open', on); costBtn.setAttribute('aria-expanded', String(on));
    if (!on) tip.style.display = 'none';
  }
  costBtn.onclick = function(){ show(!panel.classList.contains('open')); };
  panel.querySelector('.fold').onclick = function(){ show(false); costBtn.focus(); };
  document.addEventListener('pointerdown', function(e){
    if (panel.classList.contains('open') && !panel.contains(e.target) && e.target !== costBtn) show(false);
  });
  addEventListener('keydown', function(e){             // Esc는 챗봇 창보다 먼저 이 패널을 닫는다
    if (e.key === 'Escape' && panel.classList.contains('open')) { e.preventDefault(); e.stopImmediatePropagation(); show(false); costBtn.focus(); }
  }, true);
  panel.querySelector('.reset').onclick = function(){
    BookDialog.confirm({ title: '사용량 기록 초기화', message: '모든 모델의 누적 사용량 기록을 지울까요?\n되돌릴 수 없습니다.', ok: '초기화', danger: true })
      .then(function(yes){ if (yes) fetch('/api/usage?book=' + BOOK_ID, { method: 'DELETE' }).then(function(){ log = []; render(); }); });
  };

  // 모델별 비용 가로 누적 막대 (입력 왼쪽, 출력 오른쪽). 모델 이름은 막대 위, 합계는 오른쪽 끝
  function chart(groups){
    var W = 260, L = 2, R = 52, rowH = 30, barH = 10, pw = W - L - R, H = groups.length * rowH + 2;
    var max = Math.max.apply(null, groups.map(function(g){ return g.cost || 0; }).concat([1e-9]));
    var svg = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="모델별 비용 막대 차트">';
    groups.forEach(function(g, i){
      var y0 = i * rowH, by = y0 + 14, wIn = (g.ic || 0) / max * pw, wOut = (g.oc || 0) / max * pw, gap = wIn > 0 && wOut > 0 ? 2 : 0;
      svg += '<text x="' + L + '" y="' + (y0 + 10) + '" style="fill:var(--text-secondary);font-size:9px">' + esc(g.model) + '</text>';
      svg += '<rect x="' + L + '" y="' + by + '" width="' + pw + '" height="' + barH + '" fill="var(--grid)"/>';
      if (wIn > 0) svg += '<rect x="' + L + '" y="' + by + '" width="' + wIn + '" height="' + barH + '" fill="var(--series-1)"/>';
      if (wOut > 0) svg += '<rect x="' + (L + wIn + gap) + '" y="' + by + '" width="' + Math.max(0, wOut - gap) + '" height="' + barH + '" rx="2" fill="var(--series-2)"/>';
      svg += '<text x="' + (W - 2) + '" y="' + (by + 8.5) + '" text-anchor="end" style="fill:var(--text-primary);font-weight:700">' + fmtUsd(g.cost) + '</text>';
      svg += '<rect class="hit" data-i="' + i + '" x="0" y="' + y0 + '" width="' + W + '" height="' + rowH + '" fill="transparent"/>';
    });
    return svg + '</svg>';
  }

  // 표 한 줄: 입력·출력 칸은 토큰 아래에 비용, 마지막 칸이 입력+출력 합계
  function row(name, q, t1, c1, t2, c2, cost){
    return '<tr><td>' + name + '</td><td>' + q + '</td><td>' + fmtTok(t1) + '<div class="c">' + fmtUsd(c1) + '</div></td><td>' +
           fmtTok(t2) + '<div class="c">' + fmtUsd(c2) + '</div></td><td><b>' + fmtUsd(cost) + '</b></td></tr>';
  }

  function render(){
    var groups = byModel(), ok = groups.length && groups.every(function(g){ return g.ok; });
    var pt = 0, ct = 0, ic = 0, oc = 0, calls = 0;
    groups.forEach(function(g){ pt += g.pt; ct += g.ct; ic += g.ic || 0; oc += g.oc || 0; calls += g.calls; });
    var total = ok ? ic + oc : null;
    costBtn.textContent = '💰 ' + (loadErr ? '—' : log.length ? fmtUsd(total) : '$0');
    if (loadErr) { body.innerHTML = '<div class="up-empty">' + esc(loadErr) + '</div>'; return; }
    if (!log.length) { body.innerHTML = '<div class="up-empty">아직 질문이 없습니다. 본문 블록을 클릭해 질문하면 여기에 쌓입니다.</div>'; return; }
    body.innerHTML =
      '<div class="up-summary">' +
      '<div class="up-hero"><span class="v">' + fmtUsd(total) + '</span><span class="s">누적 비용 (입력+출력)</span></div>' +
      '<div class="up-sub">모델 ' + groups.length + '개 · 질문 ' + log.length + '회 · 모델 호출 ' + calls + '회 · ' + fmtTok(pt + ct) + ' 토큰' +
        (ok ? '' : ' · 일부 단가 정보 없음') + '</div></div>' +
      '<div class="up-more">' +
      '<div class="up-tiles">' +
        '<div class="up-tile"><div class="k"><span class="sw" style="background:var(--series-1)"></span>입력</div>' +
          '<div class="t">' + fmtTok(pt) + ' 토큰</div><div class="c">' + fmtUsd(ok ? ic : null) + '</div></div>' +
        '<div class="up-tile"><div class="k"><span class="sw" style="background:var(--series-2)"></span>출력</div>' +
          '<div class="t">' + fmtTok(ct) + ' 토큰</div><div class="c">' + fmtUsd(ok ? oc : null) + '</div></div>' +
      '</div>' +
      '<div class="up-chart-title">모델별 비용</div>' + chart(groups) +
      '<details><summary>표로 보기</summary><div class="up-table-wrap"><table>' +
        '<tr><th>모델</th><th>질문</th><th>입력</th><th>출력</th><th>합계 $</th></tr>' +
        groups.map(function(g){ return row(esc(g.model), g.q, g.pt, g.ic, g.ct, g.oc, g.cost); }).join('') +
        (groups.length > 1 ? row('<b>합계</b>', log.length, pt, ok ? ic : null, ct, ok ? oc : null, total) : '') +
        '</table></div></details></div>';

    body.querySelectorAll('rect.hit').forEach(function(h){
      h.addEventListener('mousemove', function(e){
        var g = groups[+h.dataset.i];
        tip.innerHTML = '<div class="q">' + esc(g.model) + ' · 질문 ' + g.q + '회</div>' +
          '<div class="row"><span class="sw" style="background:#2a78d6"></span>입력 ' + fmtTok(g.pt) + ' 토큰<span>' + fmtUsd(g.ic) + '</span></div>' +
          '<div class="row"><span class="sw" style="background:#eb6834"></span>출력 ' + fmtTok(g.ct) + ' 토큰<span>' + fmtUsd(g.oc) + '</span></div>' +
          '<div class="row"><b>합계</b> · 호출 ' + g.calls + '회<span><b>' + fmtUsd(g.cost) + '</b></span></div>';
        tip.style.display = 'block';
        var tw = tip.offsetWidth;
        tip.style.left = Math.max(8, Math.min(e.clientX - tw / 2, innerWidth - tw - 8)) + 'px';
        tip.style.top = (e.clientY + 14) + 'px';
      });
      h.addEventListener('mouseleave', function(){ tip.style.display = 'none'; });
    });
  }

  function reload(){
    if (location.protocol === 'file:') { loadErr = '누적 기록은 챗봇 서버에서 열어야 보입니다.'; render(); return; }
    fetch('/api/usage?book=' + BOOK_ID).then(function(r){ if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function(j){ log = j; loadErr = ''; render(); })
      .catch(function(){ loadErr = '누적 기록을 불러오지 못했습니다 — 챗봇 서버가 실행 중인지 확인하세요.'; render(); });
  }

  window.BookUsage = {
    add: function(rec){ if (rec) { log.push(rec); render(); } else reload(); },
    reload: reload, usd: fmtUsd, tok: fmtTok
  };
  reload();
})();
</script>
